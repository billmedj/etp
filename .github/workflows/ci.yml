name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol and conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check public language and repository boundaries
        run: python tools/check-language.py

      - name: Test repository verification tools
        run: python -m unittest discover -s tests -v

      - name: Test the TypeScript verifier
        working-directory: typescript
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Verify published transaction vectors
        working-directory: typescript
        run: |
          npm run verify -- ../vectors/positive-chain.json
          npm run verify -- ../vectors/positive-not-dispatched.json

      - name: Validate core and effect-profile schemas
        working-directory: profiles
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Run the portable conformance suite
        run: >-
          node --experimental-strip-types conformance/runner.ts
          --report effect-transaction-conformance-report.json

      - name: Verify the evidence index
        run: python tools/check-evidence.py

      - name: Verify the source manifest
        run: python tools/source-manifest.py --git git

      - name: Retain machine-readable evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etp-protocol-evidence
          path: |
            effect-transaction-conformance-report.json
            evidence-summary.json
            formal/tla/result.json
            SOURCE_MANIFEST.sha256
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Activate the repository toolchain
        run: rustup show active-toolchain

      - name: Test the Rust workspace
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo test --workspace --locked

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Lint all Rust targets
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build API documentation without warnings
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --locked --no-deps

      - name: Verify compiler-visible repository inputs
        if: runner.os == 'Linux'
        run: python3 tools/source-manifest.py --git git --dep-info-root target

  lean:
    name: Lean model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the pinned Lean project
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: formal/lean
          use-github-cache: false
          use-mathlib-cache: false
          leanchecker: false

      - name: Independently recheck the Lean environment
        working-directory: formal/lean
        run: lake env leanchecker ETPFormal

      - name: Reject proof placeholders and verify theorem count
        run: python3 tools/check-lean.py

  tla:
    name: Bounded TLA+ model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch checksum-pinned TLA+ tools
        run: python tools/fetch-tla2tools.py

      - name: Run the declared complete bounded search
        run: python tools/run-tla.py

      - name: Require a reproducible result record
        run: git diff --exit-code -- formal/tla/result.json

      - name: Verify evidence after model checking
        run: python tools/check-evidence.py
